[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stepdub"
version = "0.1.0"
description = "Grava o que fazes no computador e devolve Python legivel que o repete"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["automation", "macro", "recorder", "rpa", "playwright", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# O nucleo (ir, transforms, codegen) nao depende de nada.
# O Playwright so e preciso para GRAVAR e para CORRER o codigo gerado.
web = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
stepdub = "stepdub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stepdub"]

[tool.hatch.build.targets.wheel.force-include]
"src/stepdub/recorders/injected.js" = "stepdub/recorders/injected.js"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
files = ["src/stepdub"]
strict = true
warn_unreachable = true
# O Playwright so entra no extra "web"; sem ele instalado, nao falhar o type-check.
ignore_missing_imports = true
