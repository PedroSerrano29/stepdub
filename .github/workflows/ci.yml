name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs all of this before publishing

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The core must work with no browser installed, so this job never installs one.
    # That is the point: if a test needs Playwright, it belongs somewhere else.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  package:
    # Tests what `pip install` actually delivers: the built wheel, not the source tree,
    # with a real browser. The only job that runs the recorder end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel and a browser
        run: |
          pip install "$(ls dist/*.whl)[web]" pytest
          python -m playwright install --with-deps chromium

      - name: Test the installed package
        run: |
          python -c "import stepdub, sys; sys.exit('site-packages' not in stepdub.__file__)"
          python -m pytest -o pythonpath= -p no:cacheprovider
