name: Release

# Publishes to PyPI when a version tag is pushed. Nothing is ever uploaded from a
# local machine: see ADR-010.

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Tag matches the package version
        run: test -f "dist/stepdub-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stepdub
    permissions:
      id-token: write  # Trusted Publishing: PyPI trusts this workflow, no token exists
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
